name: Shared-link report

on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/analytics/geo-3267/**'
      - '.github/workflows/share-link-report.yml'
  push:
    branches: [master]
    paths:
      - 'docs/analytics/geo-3267/**'
      - '.github/workflows/share-link-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Shared-link ClickHouse fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned embedded ClickHouse engine
        run: python -m pip install chdb==4.4.0
      - name: Run shared-link query against synthetic warehouse contracts
        env:
          CHDB_PYTHON: python
        run: bun run docs/analytics/geo-3267/weekly.test.ts
