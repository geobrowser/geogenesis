name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: '1234'
      NEXT_PUBLIC_PRIVY_APP_ID: 'clpsvsqpt005fl70fe775owo5'
      # Required with no default by design — unset fails the build. 55516 = Geo testnet.
      NEXT_PUBLIC_CHAIN_ID: '55516'
      GEO_PK: '0x904403559d04da2d63089de2f903aa6cebe19cb3dc6490ad3a885261880ee874'
      IPFS_KEY: 'a'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # bun's global package cache, so each job links packages instead of downloading them.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun turbo run --filter=web build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/

  # Split across eight runners. One runner took ~12 minutes for the 731 test files, and every rebase
  # on this fast-moving master paid it again; four shards still left the longest at ~4 minutes.
  # Vitest shards by file count, not duration, so more shards also shrink the imbalance. `Test` below
  # aggregates the shards so there is still a single check to wait on.
  test-shard:
    name: 'Test (${{ matrix.shard }}/8)'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: '1234'
      NEXT_PUBLIC_PRIVY_APP_ID: 'clpsvsqpt005fl70fe775owo5'
      NEXT_PUBLIC_CHAIN_ID: '55516'
      GEO_PK: '0x904403559d04da2d63089de2f903aa6cebe19cb3dc6490ad3a885261880ee874'
      IPFS_KEY: 'a'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # bun's global package cache, so each job links packages instead of downloading them.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # `web` and `@geogenesis/auth`, not just `web`. The auth package had no tests until the
      # embedded-wallet hook earned them, and a suite the pipeline cannot see is not a safety net —
      # that hook decides whether an authenticated session ends up with a wallet, and it had been
      # wrong five times before it was covered. `--passWithNoTests` because a small package can end
      # up with no files in some shard.
      - name: Run tests
        run: bun turbo run --filter=web --filter=@geogenesis/auth test -- --shard=${{ matrix.shard }}/8 --passWithNoTests

  test:
    name: 'Test'
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.test-shard.result }}" = success

  # Nothing was running `tsc` before this. `next build` typechecks only what is in the build graph,
  # which excludes test files — which is how eight type errors accumulated in them unnoticed.
  typecheck:
    name: 'Typecheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # bun's global package cache, so each job links packages instead of downloading them.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun turbo run --filter=web typecheck

  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # bun's global package cache, so each job links packages instead of downloading them.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Run linting
        run: bun turbo run --filter=web lint
