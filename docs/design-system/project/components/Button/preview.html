<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — static rendition</title>
</head>
<body class="bg-white p-4 text-text">
<div class="flex flex-col gap-4">
  <div class="flex flex-wrap items-center gap-3">
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-transparent bg-ctaPrimary text-white hover:bg-ctaHover focus-visible:border-ctaHover focus-visible:shadow-inner-ctaHover gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Publish</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-grey-02 bg-white text-text shadow-button hover:border-text hover:bg-bg hover:text-text! focus-visible:border-text focus-visible:shadow-inner-text gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Cancel</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-white bg-text text-white shadow-none gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Tertiary</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-transparent bg-white text-grey-04! shadow-none hover:border-text hover:bg-bg hover:text-text! hover:shadow-button focus-visible:border-text focus-visible:shadow-inner-text gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Ghost</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-text bg-transparent text-text! shadow-none hover:border-text hover:text-text! focus-visible:border-text focus-visible:shadow-inner-text gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Transparent</button>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-white bg-green text-white shadow-none transition-colors duration-150 hover:bg-green/80 gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Success</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-white bg-red-01 text-white shadow-none transition-colors duration-150 hover:bg-red-01/80 gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Delete</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-green bg-green text-text transition-colors duration-150 hover:bg-green/80 gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Done</button>
    <button type="button" disabled class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-transparent bg-divider text-grey-03 hover:bg-divider gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer">Disabled</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-grey-02 bg-white text-text shadow-button hover:border-text hover:bg-bg hover:text-text! focus-visible:border-text focus-visible:shadow-inner-text h-6 gap-1.5 px-1.5 text-metadata! leading-none cursor-pointer"><svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.853553 2.14645C0.658291 1.95118 0.341709 1.95118 0.146447 2.14645C-0.0488155 2.34171 -0.0488155 2.65829 0.146447 2.85355L0.853553 2.14645ZM4 6L3.64645 6.35355L4 6.70711L4.35355 6.35355L4 6ZM7.85355 2.85355C8.04882 2.65829 8.04882 2.34171 7.85355 2.14645C7.65829 1.95118 7.34171 1.95118 7.14645 2.14645L7.85355 2.85355ZM0.146447 2.85355L3.64645 6.35355L4.35355 5.64645L0.853553 2.14645L0.146447 2.85355ZM4.35355 6.35355L7.85355 2.85355L7.14645 2.14645L3.64645 5.64645L4.35355 6.35355Z" fill="currentColor"></path></svg>Small</button>
    <button type="button" class="relative box-border flex h-6 w-6 items-center justify-center rounded border bg-white text-text transition duration-200 ease-in-out hover:border-text hover:bg-bg hover:text-text! focus:border-text focus:shadow-inner-text focus:outline-hidden border-grey-02 cursor-pointer border-divider hover:border-divider! hover:bg-divider!"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 10.5L10.5 1.5" stroke="currentColor"></path><path d="M1.5 1.5L10.5 10.5" stroke="currentColor"></path></svg></button>
    <button type="button" class="flex h-6 items-center gap-[6px] rounded border border-dashed border-grey-02 px-[7px] text-[1rem] font-normal text-grey-04 box-border"><svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.5 0.5V16.5" stroke="currentColor"></path><path d="M0.5 8.5L16.5 8.5" stroke="currentColor"></path></svg>Add type</button>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-transparent bg-ctaPrimary text-white hover:bg-ctaHover focus-visible:border-ctaHover focus-visible:shadow-inner-ctaHover gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer h-7 shrink-0 !gap-0 !rounded-full !px-2.5 !py-0 !text-[16px] !leading-[13px] font-normal tracking-[-0.35px] whitespace-nowrap !shadow-none !border-transparent !bg-[#151515] !text-white hover:!bg-[#151515] focus-visible:!border-text focus-visible:!shadow-inner-text">Log in</button>
    <button type="button" class="relative inline-flex items-center justify-center rounded border font-medium tracking-[-0.17px] shadow-light transition duration-200 ease-in-out focus:outline-hidden border-grey-02 bg-white text-text shadow-button hover:border-text hover:bg-bg hover:text-text! focus-visible:border-text focus-visible:shadow-inner-text gap-2 px-3 py-2 text-button text-[1.0625rem] leading-4.5 cursor-pointer h-7 shrink-0 !gap-0 !rounded-full !px-2.5 !py-0 !text-[16px] !leading-[13px] font-normal tracking-[-0.35px] whitespace-nowrap !shadow-none">Sign up</button>
  </div>
  <div class="grid w-[340px] grid-cols-2 gap-2">
    <button type="button" class="flex h-7 md:h-11 w-full items-center justify-center rounded-full border border-grey-02 bg-white px-4 text-metadata text-text transition-colors hover:bg-grey-01 disabled:opacity-50">Not now</button>
    <button type="button" class="flex h-7 md:h-11 w-full items-center justify-center rounded-full bg-text px-4 text-metadata text-white transition-colors hover:bg-text/90 disabled:opacity-50">Explore claims</button>
  </div>
</div>
</body>
</html>
