<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextButton — static rendition</title>
</head>
<body class="bg-white p-4 text-text">
<div class="flex items-center gap-6">
  <button type="button" class="flex items-center bg-transparent text-smallButton outline-hidden hover:outline-hidden focus:outline-hidden text-grey-04 hover:text-text">Clear</button>
  <button type="button" class="flex items-center bg-transparent text-smallButton outline-hidden hover:outline-hidden focus:outline-hidden text-ctaPrimary hover:text-ctaHover">Add filter</button>
  <button type="button" disabled class="flex items-center bg-transparent text-smallButton outline-hidden hover:outline-hidden focus:outline-hidden cursor-not-allowed text-grey-04 text-grey-04 hover:text-text">Disabled</button>
  <button type="button" class="self-center px-3 py-2 text-metadata text-text underline underline-offset-2 hover:opacity-70">Back to times</button>
</div>
</body>
</html>
