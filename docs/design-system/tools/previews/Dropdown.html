<!-- @dsCard group="Overlays" height=250 subtitle="Trigger with ctaPrimary chevron, 273px list with grey-02 rules" -->
<div class="flex flex-col items-start gap-1.5">
  <span class="shadow-button"><button type="button" class="flex grow items-center justify-between rounded bg-white px-3 py-2 text-button whitespace-nowrap text-text shadow-inner-grey-02 hover:shadow-inner-text focus:shadow-inner-lg-text data-placeholder:text-text">Most recent<span class="inline-block w-2"></span><span class="text-ctaPrimary">{{icon:chevron-down-small}}</span></button></span>
  <div class="z-10 w-[273px] rounded border border-grey-02 bg-white shadow-lg origin-top-left overflow-hidden"><div class="overflow-hidden">
    <div class="flex min-h-10 cursor-pointer items-center justify-between border-b border-b-grey-02 px-3 py-2 text-button text-grey-04 select-none last:border-none hover:bg-bg hover:text-text hover:outline-hidden aria-disabled:cursor-not-allowed aria-disabled:text-grey-04">Most recent</div>
    <div class="flex min-h-10 cursor-pointer items-center justify-between border-b border-b-grey-02 px-3 py-2 text-button text-grey-04 select-none last:border-none hover:bg-bg hover:text-text hover:outline-hidden aria-disabled:cursor-not-allowed aria-disabled:text-grey-04 bg-bg text-text">Most votes</div>
    <div aria-disabled="true" class="flex min-h-10 cursor-pointer items-center justify-between border-b border-b-grey-02 px-3 py-2 text-button text-grey-04 select-none last:border-none hover:bg-bg hover:text-text hover:outline-hidden aria-disabled:cursor-not-allowed aria-disabled:text-grey-04">Oldest<span class="text-smallButton text-grey-04">Coming soon</span></div>
  </div></div>
</div>
