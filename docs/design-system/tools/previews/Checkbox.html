<!-- @dsCard group="Forms" height=110 subtitle="Checkbox (checked, unchecked, mixed) and the filled 14px variant" -->
<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <button class="relative box-border inline-flex size-4 items-center justify-center rounded-[4px] border border-text bg-white transition duration-200 ease-in-out *:size-3 hover:bg-bg focus:outline-hidden">{{icon:check}}</button>
    <button class="relative box-border inline-flex size-4 items-center justify-center rounded-[4px] border border-text bg-white transition duration-200 ease-in-out *:size-3 hover:bg-bg focus:outline-hidden">{{icon:blank}}</button>
    <button class="relative box-border inline-flex size-4 items-center justify-center rounded-[4px] border border-text bg-white transition duration-200 ease-in-out *:size-3 hover:bg-bg focus:outline-hidden">{{icon:minus}}</button>
  </div>
  <div class="flex items-center gap-4">
    <span aria-hidden="true" class="inline-flex size-3.5 shrink-0 items-center justify-center rounded-sm border border-text bg-text text-white"><svg viewBox="0 0 10 10" class="size-2.5" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5.2 4.1 7.2 8 3"></path></svg></span>
    <span aria-hidden="true" class="inline-flex size-3.5 shrink-0 items-center justify-center rounded-sm border border-grey-03 bg-white"></span>
  </div>
</div>
