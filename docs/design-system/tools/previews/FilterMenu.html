<!-- @dsCard group="Chips" height=330 subtitle="Pill trigger and open multi-select list with All row and counts" -->
<div class="flex gap-6">
  <div class="flex flex-col gap-2">
    <button type="button" class="inline-flex shrink-0 items-center gap-1 rounded-full border border-grey-02 px-[10px] py-[7px] text-[16px] leading-[20px] font-normal text-[#2A2B2E] hover:bg-grey-01 max-w-[220px]"><span class="truncate">All statuses</span><span class="shrink-0">{{icon:chevron-down-small}}</span></button>
    <div class="pointer-events-auto isolate z-100 w-full max-w-[360px] min-w-0 overflow-hidden rounded-lg border border-grey-02 bg-white shadow-lg outline-none focus:outline-none focus-visible:outline-none origin-top-left max-w-[280px] w-[240px]"><div class="min-h-0 w-full min-w-0 overflow-y-auto overscroll-contain bg-white [background-clip:padding-box] max-h-[320px]"><div class="flex flex-col p-2" role="group">
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span class="relative box-border inline-flex size-4 shrink-0 items-center justify-center rounded-[4px] border border-text bg-white *:size-3" aria-hidden="true">{{icon:minus}}</span><span class="min-w-0 truncate">All</span></button>
      <div class="my-1 h-px shrink-0 bg-divider" aria-hidden="true"></div>
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span class="relative box-border inline-flex size-4 shrink-0 items-center justify-center rounded-[4px] border border-text bg-white *:size-3" aria-hidden="true">{{icon:check}}</span><span class="min-w-0 truncate">Open</span><span class="ml-auto shrink-0 pl-3 text-[14px] leading-[20px] text-grey-04 tabular-nums">1,204</span></button>
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span class="relative box-border inline-flex size-4 shrink-0 items-center justify-center rounded-[4px] border border-text bg-white *:size-3" aria-hidden="true">{{icon:check}}</span><span class="min-w-0 truncate">In review</span><span class="ml-auto shrink-0 pl-3 text-[14px] leading-[20px] text-grey-04 tabular-nums">86</span></button>
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span class="relative box-border inline-flex size-4 shrink-0 items-center justify-center rounded-[4px] border border-text bg-white *:size-3" aria-hidden="true">{{icon:blank}}</span><span class="min-w-0 truncate">Paid</span><span class="ml-auto shrink-0 pl-3 text-[14px] leading-[20px] text-grey-04 tabular-nums">412</span></button>
      <button type="button" disabled class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span class="relative box-border inline-flex size-4 shrink-0 items-center justify-center rounded-[4px] border border-text bg-white *:size-3" aria-hidden="true">{{icon:blank}}</span><span class="min-w-0 truncate">Expired</span><span class="ml-auto shrink-0 pl-3 text-[14px] leading-[20px] text-grey-04 tabular-nums">0</span></button>
    </div></div></div>
  </div>
  <div class="flex flex-col gap-2">
    <button type="button" class="inline-flex shrink-0 items-center gap-1 rounded-full border border-grey-02 px-[10px] py-[7px] text-[16px] leading-[20px] font-normal text-[#2A2B2E] hover:bg-grey-01 max-w-[220px]"><span class="truncate">Newest</span><span class="shrink-0">{{icon:chevron-down-small}}</span></button>
    <div class="pointer-events-auto isolate z-100 w-full max-w-[360px] min-w-0 overflow-hidden rounded-lg border border-grey-02 bg-white shadow-lg outline-none focus:outline-none focus-visible:outline-none origin-top-left max-w-[280px] w-[200px]"><div class="min-h-0 w-full min-w-0 overflow-y-auto overscroll-contain bg-white [background-clip:padding-box] max-h-[320px]"><div class="flex flex-col p-2" role="menu">
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span aria-hidden="true" class="flex size-4 shrink-0 items-center justify-center">{{icon:check}}</span><span class="min-w-0 truncate">Newest</span></button>
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span aria-hidden="true" class="flex size-4 shrink-0 items-center justify-center invisible">{{icon:check}}</span><span class="min-w-0 truncate">Most votes</span></button>
      <button type="button" class="flex w-full cursor-pointer items-center gap-2 rounded px-2 py-2 text-left text-[16px] leading-[20px] text-[#2A2B2E] hover:bg-grey-01 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent"><span aria-hidden="true" class="flex size-4 shrink-0 items-center justify-center invisible">{{icon:check}}</span><span class="min-w-0 truncate">Ending soon</span></button>
    </div></div></div>
  </div>
</div>
